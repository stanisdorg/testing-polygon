{{- if .Values.eventConsumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-event-consumer
  labels:
    app: {{ .Release.Name }}-event-consumer
    {{- include "fulfilbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.eventConsumer.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-event-consumer
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-event-consumer
    spec:
      containers:
        - name: event-consumer
          image: {{ .Values.eventConsumer.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.eventConsumer.port }}
              name: metrics
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "fulfilbox.fullname" . }}-config
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "fulfilbox.fullname" . }}-config
                  key: REDIS_URL
            - name: KAFKA_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "fulfilbox.fullname" . }}-config
                  key: KAFKA_BROKER_URL
            - name: WS_GATEWAY_URL
              value: "http://{{ .Release.Name }}-ws-gateway:8002"
            - name: METRICS_PORT
              value: {{ .Values.eventConsumer.port | quote }}
          resources:
            {{- toYaml .Values.eventConsumer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-event-consumer
  labels:
    app: {{ .Release.Name }}-event-consumer
spec:
  ports:
    - port: {{ .Values.eventConsumer.port }}
      targetPort: {{ .Values.eventConsumer.port }}
  selector:
    app: {{ .Release.Name }}-event-consumer
{{- end }}
