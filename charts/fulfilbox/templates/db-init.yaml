apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "fulfilbox.labels" . | nindent 4 }}
data:
  init.sql: |
    -- Initial schema for FulfilBox
    CREATE TABLE IF NOT EXISTS orders (
        id VARCHAR(30) PRIMARY KEY,
        status VARCHAR(20) NOT NULL DEFAULT 'created',
        created_at TIMESTAMP DEFAULT NOW(),
        total_price NUMERIC(10,2) DEFAULT 0,
        saga_id VARCHAR(50),
        warehouse_id VARCHAR(20) DEFAULT 'WH-MSK-S'
    );

    CREATE TABLE IF NOT EXISTS events (
        id SERIAL PRIMARY KEY,
        event_type VARCHAR(50) NOT NULL,
        order_id VARCHAR(30) NOT NULL,
        payload JSONB,
        trace_id VARCHAR(50),
        entity_type VARCHAR(30),
        entity_id VARCHAR(50),
        saga_id VARCHAR(50),
        step_name VARCHAR(50),
        is_compensation BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT NOW(),
        processed BOOLEAN DEFAULT FALSE,
        retry_count INTEGER DEFAULT 0
    );

    CREATE UNIQUE INDEX IF NOT EXISTS events_order_event_unique ON events(order_id, event_type, saga_id);
    CREATE INDEX IF NOT EXISTS idx_events_order_id ON events(order_id);
    CREATE INDEX IF NOT EXISTS idx_events_saga_id ON events(saga_id);
    CREATE INDEX IF NOT EXISTS idx_events_processed ON events(processed) WHERE processed = FALSE;

    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        sku VARCHAR(30) UNIQUE NOT NULL,
        name VARCHAR(200) NOT NULL,
        price NUMERIC(10,2) NOT NULL DEFAULT 0,
        created_at TIMESTAMP DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS warehouses (
        id VARCHAR(20) PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        location VARCHAR(200) NOT NULL DEFAULT ''
    );

    CREATE TABLE IF NOT EXISTS inventory (
        id SERIAL PRIMARY KEY,
        sku VARCHAR(30) NOT NULL REFERENCES products(sku),
        warehouse_id VARCHAR(20) NOT NULL REFERENCES warehouses(id),
        available_qty INTEGER NOT NULL DEFAULT 0,
        reserved_qty INTEGER NOT NULL DEFAULT 0,
        UNIQUE(sku, warehouse_id)
    );

    CREATE TABLE IF NOT EXISTS employees (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        role VARCHAR(30) NOT NULL CHECK (role IN ('picker','packer','courier'))
    );

    CREATE TABLE IF NOT EXISTS vehicles (
        id SERIAL PRIMARY KEY,
        plate_number VARCHAR(20) UNIQUE NOT NULL,
        capacity NUMERIC(5,1) NOT NULL DEFAULT 1.0
    );

    CREATE TABLE IF NOT EXISTS deliveries (
        id SERIAL PRIMARY KEY,
        order_id VARCHAR(30) NOT NULL REFERENCES orders(id),
        courier_name VARCHAR(100),
        status VARCHAR(20) DEFAULT 'assigned' CHECK (status IN ('assigned','in_transit','delivered','cancelled')),
        cancelled BOOLEAN DEFAULT FALSE
    );

    CREATE TABLE IF NOT EXISTS payments (
        id SERIAL PRIMARY KEY,
        order_id VARCHAR(30) NOT NULL REFERENCES orders(id),
        amount NUMERIC(10,2) DEFAULT 0,
        status VARCHAR(20) DEFAULT 'requested' CHECK (status IN ('requested','succeeded','failed','refunded')),
        created_at TIMESTAMP DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS order_items (
        id SERIAL PRIMARY KEY,
        order_id VARCHAR(30) NOT NULL REFERENCES orders(id),
        sku VARCHAR(30) NOT NULL,
        qty INTEGER NOT NULL DEFAULT 1
    );

    -- Seed data
    INSERT INTO warehouses (id, name, location) VALUES
    ('WH-MSK-S', 'Склад Москва-Юг', 'Москва, Южный район'),
    ('WH-MSK-N', 'Склад Москва-Север', 'Москва, Северный район'),
    ('WH-KZN', 'Склад Казань', 'Казань, Центр')
    ON CONFLICT (id) DO NOTHING;

    INSERT INTO products (sku, name, price) VALUES
    ('SKU-001', 'Наушники Bluetooth', 2990),
    ('SKU-002', 'Чехол iPhone 15', 990),
    ('SKU-003', 'Кабель USB-C', 490)
    ON CONFLICT (sku) DO NOTHING;

    INSERT INTO inventory (sku, warehouse_id, available_qty, reserved_qty) VALUES
    ('SKU-001', 'WH-MSK-S', 100, 0),
    ('SKU-002', 'WH-MSK-S', 200, 0),
    ('SKU-003', 'WH-MSK-S', 50, 0),
    ('SKU-001', 'WH-MSK-N', 50, 0),
    ('SKU-002', 'WH-MSK-N', 100, 0)
    ON CONFLICT (sku, warehouse_id) DO NOTHING;

    INSERT INTO employees (name, role) VALUES
    ('Иван П.', 'picker'), ('Мария С.', 'picker'), ('Анна К.', 'picker'),
    ('Сергей Л.', 'picker'), ('Ольга М.', 'picker'),
    ('Алексей К.', 'packer'), ('Олег Н.', 'packer'), ('Ирина Т.', 'packer'),
    ('Виктор С.', 'packer'), ('Наталья Р.', 'packer'),
    ('Дмитрий В.', 'courier'), ('Елена Р.', 'courier'), ('Артём Ж.', 'courier'),
    ('Кирилл О.', 'courier'), ('Валентина П.', 'courier')
    ON CONFLICT DO NOTHING;

    INSERT INTO vehicles (plate_number, capacity) VALUES
    ('А001АА77', 2.0), ('Б002ББ77', 1.5), ('В003ВВ77', 3.0)
