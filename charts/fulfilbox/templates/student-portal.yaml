{{- if .Values.studentPortal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-student-portal
  labels:
    app: {{ .Release.Name }}-student-portal
    {{- include "fulfilbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.studentPortal.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-student-portal
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-student-portal
    spec:
      containers:
        - name: student-portal
          image: {{ .Values.studentPortal.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.studentPortal.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "fulfilbox.fullname" . }}-config
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "fulfilbox.fullname" . }}-config
                  key: REDIS_URL
            - name: CONFIG_PATH
              value: "/app/config.json"
          resources:
            {{- toYaml .Values.studentPortal.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.studentPortal.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.studentPortal.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-student-portal
  labels:
    app: {{ .Release.Name }}-student-portal
spec:
  type: NodePort
  ports:
    - port: {{ .Values.studentPortal.port }}
      targetPort: {{ .Values.studentPortal.port }}
      nodePort: 30080
  selector:
    app: {{ .Release.Name }}-student-portal
{{- end }}
