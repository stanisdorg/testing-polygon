apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-consumer
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-consumer
  template:
    metadata:
      labels:
        app: event-consumer
    spec:
      containers:
        - name: event-consumer
          image: testing-polygon-event-consumer-service:latest
          env:
            - name: DATABASE_URL
              value: "postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox"
            - name: WS_GATEWAY_URL
              value: "http://ws-gateway:8002"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: KAFKA_BROKER_URL
              value: "kafka:29092"
            - name: METRICS_PORT
              value: "8003"
          ports:
            - containerPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: event-consumer
  namespace: fulfilbox
spec:
  selector:
    app: event-consumer
  ports:
    - port: 8003
      targetPort: 8003
