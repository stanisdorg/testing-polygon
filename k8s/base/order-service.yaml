apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: testing-polygon-order-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: "postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: KAFKA_BROKER_URL
              value: "kafka:29092"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: fulfilbox
spec:
  selector:
    app: order-service
  ports:
    - port: 8001
      targetPort: 8001
