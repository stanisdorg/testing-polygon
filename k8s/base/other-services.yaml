apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-service
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulation-service
  template:
    metadata:
      labels:
        app: simulation-service
    spec:
      containers:
        - name: simulation-service
          image: testing-polygon-simulation-service:latest
          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-gateway
  template:
    metadata:
      labels:
        app: ws-gateway
    spec:
      containers:
        - name: ws-gateway
          image: testing-polygon-ws-gateway:latest
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
  namespace: fulfilbox
spec:
  selector:
    app: ws-gateway
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-portal
  template:
    metadata:
      labels:
        app: student-portal
    spec:
      containers:
        - name: student-portal
          image: testing-polygon-student-portal:latest
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: "/app/config.json"
---
apiVersion: v1
kind: Service
metadata:
  name: student-portal
  namespace: fulfilbox
spec:
  selector:
    app: student-portal
  ports:
    - port: 8080
      targetPort: 8080
