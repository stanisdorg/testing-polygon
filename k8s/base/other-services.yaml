apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-service
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfilbox-simulation
  template:
    metadata:
      labels:
        app: fulfilbox-simulation
    spec:
      containers:
        - name: simulation-service
          image: fulfilbox/simulation-service:latest
          imagePullPolicy: Never
          env:
            - name: ORDER_SERVICE_URL
              value: "http://fulfilbox-order-service:8001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfilbox-ws-gateway
  template:
    metadata:
      labels:
        app: fulfilbox-ws-gateway
    spec:
      containers:
        - name: ws-gateway
          image: fulfilbox/ws-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
  namespace: fulfilbox
spec:
  selector:
    app: fulfilbox-ws-gateway
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-portal
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfilbox-student-portal
  template:
    metadata:
      labels:
        app: fulfilbox-student-portal
    spec:
      serviceAccountName: dashboard-reader
      containers:
        - name: student-portal
          image: fulfilbox/student-portal:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: "/app/config.json"
            - name: DATABASE_URL
              value: "postgresql://fulfilbox:fulfilbox@fulfilbox-postgres:5432/fulfilbox"
            - name: REDIS_URL
              value: "redis://fulfilbox-redis:6379/0"
            - name: KAFKA_BROKER_URL
              value: "fulfilbox-kafka:9092"
            - name: GRAPHQL_URL
              value: "http://fulfilbox-graphql-gateway:8005/graphql"
            - name: WS_URL
              value: "ws://fulfilbox-ws-gateway:8002/ws/events"
            - name: UI_DASHBOARD_DIR
              value: "/app/ui-dashboard"
            - name: UI_TASKS_DIR
              value: "/app/ui-tasks"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: student-portal
  namespace: fulfilbox
spec:
  type: NodePort
  selector:
    app: fulfilbox-student-portal
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
