apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-reader
  namespace: fulfilbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: dashboard-reader
  namespace: fulfilbox
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-reader-token
  namespace: fulfilbox
  annotations:
    kubernetes.io/service-account.name: dashboard-reader
type: kubernetes.io/service-account-token
