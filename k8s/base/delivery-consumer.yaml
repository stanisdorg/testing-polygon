apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-consumer
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfilbox-delivery-consumer
  template:
    metadata:
      labels:
        app: fulfilbox-delivery-consumer
    spec:
      containers:
        - name: delivery-consumer
          image: fulfilbox/delivery-consumer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8013
          env:
            - name: DATABASE_URL
              value: "postgresql://fulfilbox:fulfilbox@fulfilbox-postgres:5432/fulfilbox"
            - name: REDIS_URL
              value: "redis://fulfilbox-redis:6379/0"
            - name: KAFKA_BROKER_URL
              value: "fulfilbox-kafka:9092"
            - name: METRICS_PORT
              value: "8013"
            - name: SAGA_STEP_DELAY_MIN
              value: "1"
            - name: SAGA_STEP_DELAY_MAX
              value: "3"
