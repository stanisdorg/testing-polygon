apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: fulfilbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfilbox-graphql-gateway
  template:
    metadata:
      labels:
        app: fulfilbox-graphql-gateway
    spec:
      containers:
        - name: graphql-gateway
          image: fulfilbox/graphql-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8005
              name: graphql
          env:
            - name: DATABASE_URL
              value: "postgresql://fulfilbox:fulfilbox@fulfilbox-postgres:5432/fulfilbox"
            - name: KAFKA_BROKER_URL
              value: "fulfilbox-kafka:9092"
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fulfilbox-graphql-gateway
  namespace: fulfilbox
spec:
  selector:
    app: fulfilbox-graphql-gateway
  ports:
    - port: 8005
      targetPort: 8005
      name: graphql
