# ============================================================
# FulfilBox — Docker Compose (dual profile: lite / full)
# ============================================================
# Lite  (default):  Loki + Grafana for logs — ~3.5 GB RAM
# Full  (--profile full): ELK (Elasticsearch + Kibana) — ~7 GB RAM
#
# Usage:
#   docker compose up -d                     # Lite (Loki)
#   docker compose --profile full up -d      # Full (ELK)
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fulfilbox
      POSTGRES_PASSWORD: fulfilbox
      POSTGRES_DB: fulfilbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfilbox"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  order-service:
    build: ./services/order-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER_URL: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Event Consumers (NEW: Event-Driven Architecture) ──────────────────
  inventory-consumer:
    build: ./services/inventory-consumer
    environment:
      DATABASE_URL: postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER_URL: kafka:29092
      METRICS_PORT: "8010"
      SAGA_STEP_DELAY_MIN: "0"
      SAGA_STEP_DELAY_MAX: "1"
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  payment-consumer:
    build: ./services/payment-consumer
    environment:
      DATABASE_URL: postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER_URL: kafka:29092
      METRICS_PORT: "8011"
      PAYMENT_SUCCESS_RATE: "0.8"
      SAGA_STEP_DELAY_MIN: "0"
      SAGA_STEP_DELAY_MAX: "1"
    ports:
      - "8011:8011"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  warehouse-consumer:
    build: ./services/warehouse-consumer
    environment:
      DATABASE_URL: postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER_URL: kafka:29092
      METRICS_PORT: "8012"
      SAGA_STEP_DELAY_MIN: "0"
      SAGA_STEP_DELAY_MAX: "1"
    ports:
      - "8012:8012"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  delivery-consumer:
    build: ./services/delivery-consumer
    environment:
      DATABASE_URL: postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER_URL: kafka:29092
      METRICS_PORT: "8013"
      SAGA_STEP_DELAY_MIN: "0"
      SAGA_STEP_DELAY_MAX: "1"
    ports:
      - "8013:8013"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  saga-monitor:
    build: ./services/saga-monitor
    environment:
      DATABASE_URL: postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER_URL: kafka:29092
      METRICS_PORT: "8014"
      COMPENSATION_DELAY: "0"
    ports:
      - "8014:8014"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  simulation-service:
    build: ./services/simulation-service
    environment:
      ORDER_SERVICE_URL: http://order-service:8001
    depends_on:
      order-service:
        condition: service_healthy

  ws-gateway:
    build: ./services/ws-gateway
    ports:
      - "8002:8002"
    depends_on:
      order-service:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    depends_on:
      - inventory-consumer
      - payment-consumer
      - warehouse-consumer
      - delivery-consumer
      - saga-monitor

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=fulfilbox2024
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  akhq:
    image: tchiotludo/akhq:latest
    ports:
      - "8081:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-server:
              properties:
                bootstrap.servers: "kafka:29092"
              connect:
                - name: kafka-connect
                  url: "http://kafka:29092"
    depends_on:
      - kafka

  # ── Redis UI (default — lightweight) ────────────────────
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    ports:
      - "8085:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    profiles: ["default", "lite", "full"]

  # ── RedisInsight (full profile — heavy) ─────────────────
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "8086:5540"
    volumes:
      - redisinsight-data:/data
    profiles: ["full"]

  # ── Loki (Log Aggregation — default, lightweight) ──────
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    profiles: ["default", "lite", "full"]

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles: ["default", "lite", "full"]

  # ── ELK Stack (Full profile only — heavy) ──────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q green"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles: ["full"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q green"]
      interval: 10s
      timeout: 10s
      retries: 10
    profiles: ["full"]

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    user: root
    command: filebeat run -E strict.perms=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    profiles: ["full"]

  student-portal:
    build: ./services/student-portal
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /app/config.json
      DATABASE_URL: postgresql://fulfilbox:fulfilbox@postgres:5432/fulfilbox
      UI_TASKS_DIR: /app/ui-tasks
      UI_DASHBOARD_DIR: /app/ui-dashboard
      KUBECONFIG: /root/.kube/config
    volumes:
      - ./services/student-portal/config.json:/app/config.json
      - ./ui-tasks:/app/ui-tasks
      - ./ui-dashboard:/app/ui-dashboard
      - ./services/saga-monitor/chaos_config.json:/app/chaos_config.json
      - /tmp/kubeconfig-docker:/root/.kube/config:ro
    depends_on:
      - postgres
      - redis
      - kafka

volumes:
  postgres-data:
    driver: local
  es-data:
    driver: local
  loki-data:
    driver: local
  redisinsight-data:
    driver: local
