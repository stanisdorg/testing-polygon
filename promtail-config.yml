# Promtail configuration for FulfilBox
# Collects Docker container logs and sends to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=testing-polygon"]
    pipeline_stages:
      - json:
          expressions:
            stream: stream
            attrs:
            time:
            log:
      - json:
          expressions:
            tag:
          source: attrs
      - labels:
          container_name:
          stream:
      - regex:
          expression: "(?P<container_name>testing-polygon-(?P<service>[^-]+(?:-[^-]+)*)-\\d+)"
      - labels:
          service:
      - output:
          source: log
