<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FulfilBox — Задания для студентов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e4e9; min-height: 100vh; }
        header { background: #161922; padding: 16px 24px; border-bottom: 1px solid #2a2e3d; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        header h1 { font-size: 20px; color: #6c63ff; }
        header span { color: #8b8fa3; font-size: 13px; }
        .progress-section { display: flex; align-items: center; gap: 12px; }
        .progress-bar { background: #2a2e3d; border-radius: 8px; height: 8px; width: 160px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #6c63ff, #8b83ff); height: 100%; transition: width 0.3s; }
        .progress-text { font-size: 13px; color: #8b8fa3; }
        .container { max-width: 1000px; margin: 24px auto; padding: 0 24px; }
        .module { background: #1e2230; border: 1px solid #2a2e3d; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .module-header { padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
        .module-header:hover { background: rgba(108,99,255,0.05); }
        .module-title { font-size: 16px; font-weight: 600; color: #6c63ff; }
        .module-count { font-size: 13px; color: #8b8fa3; }
        .module-content { display: none; border-top: 1px solid #2a2e3d; padding: 16px 20px; }
        .module-content.open { display: block; }
        .task { background: #161922; border: 1px solid #2a2e3d; border-radius: 8px; padding: 16px; margin-bottom: 12px; transition: border-color 0.15s; }
        .task:hover { border-color: #6c63ff; }
        .task.completed { border-color: #2ecc71; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
        .task-title { font-size: 14px; font-weight: 600; }
        .task-check { display: flex; align-items: center; gap: 8px; }
        .task-check input[type="checkbox"] { width: 18px; height: 18px; accent-color: #6c63ff; cursor: pointer; }
        .task-check label { font-size: 12px; color: #8b8fa3; cursor: pointer; }
        .task-check label.done { color: #2ecc71; }
        .task-desc { font-size: 13px; color: #8b8fa3; line-height: 1.6; }
        .task-desc code { background: #2a2e3d; padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #e2e4e9; }
        .task-links { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
        .task-links a { color: #6c63ff; text-decoration: none; font-size: 12px; padding: 2px 8px; border: 1px solid #2a2e3d; border-radius: 4px; }
        .task-links a:hover { background: rgba(108,99,255,0.1); }
        .task-hint { margin-top: 8px; }
        .task-hint button { background: none; border: 1px solid #2a2e3d; color: #8b8fa3; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .task-hint button:hover { color: #e2e4e9; border-color: #6c63ff; }
        .hint-content { display: none; margin-top: 8px; padding: 10px 14px; background: rgba(108,99,255,0.05); border-radius: 6px; font-size: 12px; color: #8b8fa3; line-height: 1.5; }
        .hint-content.open { display: block; }
        .hint-content code { background: #2a2e3d; padding: 2px 6px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #e2e4e9; }
        .hint-content pre { background: #0f1117; padding: 8px 12px; border-radius: 4px; margin-top: 6px; overflow-x: auto; font-size: 11px; }
        .reset-btn { background: none; border: 1px solid #e74c3c; color: #e74c3c; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .reset-btn:hover { background: rgba(231,76,60,0.1); }
    </style>
</head>
<body>
<header>
    <div>
        <h1>🎓 FulfilBox — Задания</h1>
        <span>Практические задания для QA-инженеров</span>
    </div>
    <div class="progress-section">
        <div class="progress-bar"><div class="progress-fill" id="progress" style="width: 0%"></div></div>
        <span class="progress-text" id="progress-text">0/0</span>
        <button class="reset-btn" onclick="resetProgress()">🔄 Сброс</button>
    </div>
</header>

<div class="container" id="tasks-container"></div>

<script>
// ── Base URL configuration ──
const BASE_URL = window.__BASE_URL__ || (window.location.origin.includes('localhost') ? 'http://localhost' : window.location.origin);

const TASKS = [
    {
        module: "01. Docker — Основы",
        tasks: [
            {
                title: "Проверь установку Docker",
                desc: "Выполни <code>docker --version</code> и <code>docker info</code>. Убедись что Docker запущен.",
                hint: "docker --version<br>docker info",
                check: "docker info | grep 'Server Version'"
            },
            {
                title: "Запусти Redis в контейнере",
                desc: "Загрузи образ <code>redis:7.2.4-alpine</code> и запусти контейнер с маппингом порта 6379.",
                hint: "<pre>docker pull redis:7.2.4-alpine\ndocker run -d --name test-redis -p 6379:6379 redis:7.2.4-alpine</pre>",
                check: "docker ps | grep test-redis"
            },
            {
                title: "Проверь что Redis работает",
                desc: "Подключись к Redis CLI и выполни <code>PING</code>. Ожидаемый ответ: <code>PONG</code>. Затем <code>SET test_key hello</code> и <code>GET test_key</code>.",
                hint: "<pre>docker exec -it test-redis redis-cli\n127.0.0.1:6379> PING\nPONG\n127.0.0.1:6379> SET test_key hello\nOK\n127.0.0.1:6379> GET test_key\n\"hello\"</pre>",
                check: "docker exec test-redis redis-cli PING"
            },
            {
                title: "Посмотри логи и ресурсы",
                desc: "Выполни <code>docker logs test-redis</code> и <code>docker stats test-redis --no-stream</code>.",
                hint: "<pre>docker logs test-redis\ndocker stats test-redis --no-stream</pre>",
                check: "docker stats test-redis --no-stream"
            },
            {
                title: "Собери свой Docker образ",
                desc: "Создай <code>Dockerfile</code> на основе <code>alpine:3.19</code> с curl и jq. Собери и запусти.",
                hint: "<pre>mkdir -p /tmp/docker-lab\ncat > /tmp/docker-lab/Dockerfile << 'EOF'\nFROM alpine:3.19\nRUN apk add --no-cache curl jq\nENTRYPOINT [\"sh\"]\nEOF\ndocker build -t my-alpine /tmp/docker-lab\ndocker run --rm my-alpine curl --version</pre>",
                check: "docker images | grep my-alpine"
            }
        ]
    },
    {
        module: "02. REST API + Swagger",
        tasks: [
            {
                title: "Получи список заказов",
                desc: "Выполни <code>GET ${BASE_URL}:8001/api/v1/orders</code> через curl.",
                hint: "<pre>curl ${BASE_URL}:8001/api/v1/orders</pre>",
                check: "curl -s ${BASE_URL}:8001/api/v1/orders"
            },
            {
                title: "Создай заказ через API",
                desc: "Отправь <code>POST /api/v1/orders</code> с JSON. Проверь что вернулся статус 201 и <code>trace_id</code>.",
                hint: "<pre>curl -X POST ${BASE_URL}:8001/api/v1/orders \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"order_id\":\"ORD-001\",\"items\":[{\"sku\":\"SKU-001\",\"qty\":1}]}'</pre>",
                check: "curl -s -o /dev/null -w '%{http_code}' -X POST ..."
            },
            {
                title: "Изучи Swagger документацию",
                desc: "Открой Swagger UI и ReDoc. Попробуй выполнить запрос прямо из Swagger.",
                hint: "Нажми 'Try it out' → заполни body → Execute",
                check: "",
                links: [
                    { text: "📝 Swagger UI", url: "${BASE_URL}:8001/docs" },
                    { text: "📖 ReDoc", url: "${BASE_URL}:8001/redoc" }
                ]
            }
        ]
    },
    {
        module: "03. Kubernetes",
        tasks: [
            {
                title: "Проверь кластер",
                desc: "Выполни <code>kubectl get nodes</code> и убедись что нода в статусе Ready.",
                hint: "<pre>minikube status\nkubectl get nodes</pre>",
                check: "kubectl get nodes"
            },
            {
                title: "Посмотри поды",
                desc: "Выполни <code>kubectl get pods -n course</code> и найди все работающие поды.",
                hint: "<pre>kubectl get pods -n course\nkubectl get all -n course</pre>",
                check: "kubectl get pods -n course | grep Running | wc -l"
            },
            {
                title: "Посмотри логи пода",
                desc: "Найди под frontend и посмотри его логи.",
                hint: "<pre>kubectl logs -l app=frontend -n course</pre>",
                check: "kubectl logs -l app=frontend -n course | tail -5"
            },
            {
                title: "Масштабируй deployment",
                desc: "Масштабируй <code>productcatalogservice</code> до 3 реплик. Проверь. Масштабируй обратно до 1.",
                hint: "<pre>kubectl scale deployment productcatalogservice -n course --replicas=3\nkubectl get pods -l app=productcatalogservice -n course\nkubectl scale deployment productcatalogservice -n course --replicas=1</pre>",
                check: "kubectl get pods -l app=productcatalogservice -n course | wc -l"
            }
        ]
    },
    {
        module: "04. Redis Cache",
        tasks: [
            {
                title: "Подключись к Redis",
                desc: "Найди под Redis и подключись через <code>kubectl exec</code> и <code>redis-cli</code>.",
                hint: "<pre>REDIS_POD=$(kubectl get pods -n course -l app=redis -o jsonpath='{.items[0].metadata.name}')\nkubectl exec -it $REDIS_POD -n course -- redis-cli</pre>",
                check: "kubectl exec ... -- redis-cli PING"
            },
            {
                title: "Попробуй структуры данных",
                desc: "Попробуй <code>SET/GET</code>, <code>HSET/HGETALL</code>, <code>LPUSH/LRANGE</code>, <code>SADD/SMEMBERS</code>.",
                hint: "<pre>SET mykey hello\nGET mykey\nHSET user:1 name Ivan\nHGETALL user:1\nLPUSH mylist a b c\nLRANGE mylist 0 -1</pre>",
                check: ""
            },
            {
                title: "Проверь hit ratio",
                desc: "Выполни <code>INFO stats</code> и посчитай hit ratio: <code>hits / (hits + misses) * 100</code>.",
                hint: "<pre>redis-cli INFO stats | grep -E 'keyspace_hits|keyspace_misses'</pre>",
                check: "kubectl exec ... -- redis-cli INFO stats | grep keyspace"
            }
        ]
    },
    {
        module: "05. Kafka",
        tasks: [
            {
                title: "Посмотри Kafka топики",
                desc: "Открой вкладку 'Kafka' в Студенческом портале и изучи доступные топики.",
                hint: "Студенческий портал → вкладка Kafka → order_events, order_events_dlq",
                check: "",
                links: [
                    { text: "📨 Student Portal", url: "${BASE_URL}:8080" }
                ]
            },
            {
                title: "Прочитай сообщения",
                desc: "Выбери топик <code>order_events</code> и посмотри последние сообщения. Изучи структуру события.",
                hint: "Структура: {event_type, order_id, trace_id, timestamp, payload}",
                check: ""
            },
            {
                title: "Найди событие по trace_id",
                desc: "Создай заказ через API, получи trace_id и найди соответствующее событие в Kafka.",
                hint: "<pre># 1. Создай заказ\ncurl -X POST ${BASE_URL}:8001/api/v1/orders \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"order_id\":\"ORD-TEST\",\"items\":[{\"sku\":\"SKU-001\",\"qty\":1}]}'\n\n# 2. Скопируй trace_id из ответа\n# 3. Найди в Kafka вкладке сообщение с этим trace_id</pre>",
                check: ""
            }
        ]
    },
    {
        module: "06. Chaos Engineering",
        tasks: [
            {
                title: "Включи случайные задержки",
                desc: "Открой <code>chaos_config.json</code> и включи <code>random_delay</code> с вероятностью 0.2. Перезапусти consumer. Посмотри как изменились метрики в Grafana.",
                hint: "<pre># 1. Открой chaos_config.json\n# 2. Измени:\n\"random_delay\": {\n  \"enabled\": true,\n  \"probability\": 0.2,\n  \"delay_range_ms\": [100, 2000]\n}\n\n# 3. Перезапусти\ndocker compose restart event-consumer-service</pre>",
                check: "docker logs ... | grep CHAOS",
                links: [
                    { text: "📊 Grafana", url: "${BASE_URL}:3000" }
                ]
            },
            {
                title: "Включи случайные ошибки",
                desc: "Включи <code>random_failure</code> с вероятностью 10%. Подожди 1-2 минуты. Проверь алерты в Prometheus.",
                hint: "<pre>\"random_failure\": {\n  \"enabled\": true,\n  \"probability\": 0.1,\n  \"error_message\": \"Warehouse timeout\"\n}</pre>",
                check: "${BASE_URL}:9090/alerts → HighErrorRate = firing",
                links: [
                    { text: "🚨 Alerts", url: "${BASE_URL}:9090/alerts" }
                ]
            },
            {
                title: "Найди упавший заказ по trace_id",
                desc: "Найди в логах consumer упавший заказ, скопируй trace_id и проследи весь путь заказа через систему.",
                hint: "<pre>docker logs testing-polygon-event-consumer-service-1 | grep 'CHAOS.*trace_id='</pre>",
                check: ""
            },
            {
                title: "Выключи chaos",
                desc: "Выключи все сценарии в chaos_config.json. Перезапусти consumer. Убедись что алерты вернулись в inactive.",
                hint: "<pre>\"enabled\": false,\n\"failure_scenarios\": {}</pre>",
                check: "${BASE_URL}:9090/alerts → все inactive"
            }
        ]
    },
    {
        module: "07. Prometheus Alerts",
        tasks: [
            {
                title: "Изучи алерты",
                desc: "Открой Prometheus Alerts и изучи 3 правила: DLQMessagesDetected, HighErrorRate, HighLatencyP95.",
                hint: "Пороги:<br>• DLQ: dlq_total > 0<br>• Error rate: > 10%<br>• Latency p95: > 500ms",
                check: "",
                links: [
                    { text: "🚨 Alerts UI", url: "${BASE_URL}:9090/alerts" },
                    { text: "📄 Alerts Guide", url: "/docs/alerts-guide.md" }
                ]
            },
            {
                title: "Активируй алерт HighErrorRate",
                desc: "Включи <code>random_failure</code> с вероятностью 20%. Подожди 1-2 минуты. Проверь что алерт перешёл в состояние <code>FIRING</code>.",
                hint: "Условие: rate(error_total[1m]) / rate(processed_total[1m]) > 0.1",
                check: "${BASE_URL}:9090/alerts → HighErrorRate → firing"
            },
            {
                title: "Найди причину алерта",
                desc: "По trace_id найди упавшие заказы в логах. Объясни почему сработал алерт. Выключи chaos и убедись что алерт вернулся в inactive.",
                hint: "<pre>docker logs testing-polygon-event-consumer-service-1 | grep 'CHAOS.*random_failure'</pre>",
                check: ""
            }
        ]
    }
];

// ── Рендеринг ──────────────────────────────────────────────────────────
function renderTasks() {
    const container = document.getElementById('tasks-container');
    container.innerHTML = '';
    const saved = JSON.parse(localStorage.getItem('fulfilbox_tasks') || '{}');
    let totalTasks = 0, completedTasks = 0;

    TASKS.forEach((mod, mi) => {
        totalTasks += mod.tasks.length;
        const moduleDiv = document.createElement('div');
        moduleDiv.className = 'module';
        moduleDiv.innerHTML = `
            <div class="module-header" onclick="toggleModule(${mi})">
                <span class="module-title">${mod.module}</span>
                <span class="module-count">${mod.tasks.length} заданий</span>
            </div>
            <div class="module-content ${mi === 0 ? 'open' : ''}" id="mod-${mi}">
                ${mod.tasks.map((task, ti) => {
                    const key = `${mi}-${ti}`;
                    const done = saved[key] || false;
                    if (done) completedTasks++;
                    return `
                    <div class="task ${done ? 'completed' : ''}" id="task-card-${key}">
                        <div class="task-header">
                            <span class="task-title">${task.title}</span>
                            <div class="task-check">
                                <input type="checkbox" id="chk-${key}" ${done ? 'checked' : ''} onchange="toggleTask('${key}')">
                                <label for="chk-${key}" class="${done ? 'done' : ''}">${done ? '✅' : '⬜'}</label>
                            </div>
                        </div>
                        <div class="task-desc">${task.desc}</div>
                        ${task.hint ? `<div class="task-hint"><button onclick="toggleHint('hint-${key}')">💡 Подсказка</button>
                        <div class="hint-content" id="hint-${key}">${task.hint}</div></div>` : ''}
                        ${task.check ? `<div class="task-hint"><button onclick="toggleHint('chk-${key}')">🔍 Проверка</button>
                        <div class="hint-content" id="chk-${key}"><code>${task.check}</code></div></div>` : ''}
                        ${task.links && task.links.length ? `<div class="task-links">${task.links.map(l => `<a href="${l.url}" target="_blank">${l.text}</a>`).join('')}</div>` : ''}
                    </div>`;
                }).join('')}
            </div>
        `;
        container.appendChild(moduleDiv);
    });

    const pct = totalTasks > 0 ? (completedTasks / totalTasks * 100) : 0;
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${completedTasks}/${totalTasks} (${Math.round(pct)}%)`;
}

function toggleModule(mi) {
    document.getElementById(`mod-${mi}`).classList.toggle('open');
}

function toggleTask(key) {
    const saved = JSON.parse(localStorage.getItem('fulfilbox_tasks') || '{}');
    saved[key] = !saved[key];
    localStorage.setItem('fulfilbox_tasks', JSON.stringify(saved));
    renderTasks();
    // Восстановим открытый модуль
    const mi = parseInt(key.split('-')[0]);
    document.getElementById(`mod-${mi}`).classList.add('open');
}

function toggleHint(id) {
    document.getElementById(id).classList.toggle('open');
}

function resetProgress() {
    if (confirm('Сбросить весь прогресс?')) {
        localStorage.removeItem('fulfilbox_tasks');
        renderTasks();
    }
}

renderTasks();
</script>
</body>
</html>
