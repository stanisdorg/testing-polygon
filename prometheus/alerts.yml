groups:
  - name: kafka-consumer-alerts
    rules:
      - alert: DLQGrowing
        expr: dlq_size > 5
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "DLQ growing — more than 5 failed events"
          description: "DLQ size is {{ $value }} — investigate failed events"

      - alert: DLQMessagesDetected
        expr: dlq_size > 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "DLQ has messages"
          description: "Messages are being sent to Dead Letter Queue — investigate immediately"

      - alert: HighRetryRate
        expr: rate(events_retried_total[1m]) > 2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High retry rate detected"
          description: "Retry rate is above 2/sec — check failing events"

      - alert: HighErrorRate
        expr: rate(events_failed_total[1m]) > 3
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 3/sec — check logs and trace_id"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, rate(order_processing_seconds_bucket[1m])) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency"
          description: "p95 processing latency is above 500ms — system is slowing down"
